name: Patched Node build qualification
on:
  pull_request:
  push:
    branches: [master, main, production]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify patched build runtime
        run: node -e "const a=require('node:assert/strict'),z=require('node:zlib');a.equal(process.version,'v22.23.4');a.equal(z.brotliDecompressSync(z.brotliCompressSync(Buffer.from('security'))).toString(),'security');console.log(process.version)"
      - name: Install frozen historical dependency graph
        run: npm ci --legacy-peer-deps
      - name: Build retained source
        run: npm run build
      - name: Run retained unit tests
        run: npm test -- --runInBand
